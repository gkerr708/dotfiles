[mgr]
cwd = { fg = "#9ccfd8" }

find_keyword  = { fg = "#f6c177", bold = true, italic = true, underline = true }
find_position = { fg = "#c4a7e7", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#31748f", bg = "#31748f" }
marker_cut      = { fg = "#eb6f92", bg = "#eb6f92" }
marker_marked   = { fg = "#9ccfd8", bg = "#9ccfd8" }
marker_selected = { fg = "#f6c177", bg = "#f6c177" }

count_copied   = { fg = "#000000", bg = "#31748f" }
count_cut      = { fg = "#000000", bg = "#eb6f92" }
count_selected = { fg = "#000000", bg = "#f6c177" }

border_symbol = "│"
border_style  = { fg = "#6e6a86" }


[tabs]
active   = { fg = "#000000", bg = "#c4a7e7", bold = true }
inactive = { fg = "#c4a7e7", bg = "#16141f" }


[mode]
normal_main = { fg = "#000000", bg = "#c4a7e7", bold = true }
normal_alt  = { fg = "#c4a7e7", bg = "#16141f" }

select_main = { fg = "#000000", bg = "#9ccfd8", bold = true }
select_alt  = { fg = "#9ccfd8", bg = "#16141f" }

unset_main = { fg = "#000000", bg = "#ebbcba", bold = true }
unset_alt  = { fg = "#ebbcba", bg = "#16141f" }


[status]
perm_sep   = { fg = "#6e6a86" }
perm_type  = { fg = "#c4a7e7" }
perm_read  = { fg = "#f6c177" }
perm_write = { fg = "#eb6f92" }
perm_exec  = { fg = "#31748f" }

progress_label  = { fg = "#e0def4", bold = true }
progress_normal = { fg = "#31748f", bg = "#26233a" }
progress_error  = { fg = "#f6c177", bg = "#eb6f92" }


[pick]
border   = { fg = "#c4a7e7" }
active   = { fg = "#c4a7e7", bold = true }
inactive = {}


[input]
border   = { fg = "#c4a7e7" }
title    = {}
value    = {}
selected = { reversed = true }


[cmp]
border = { fg = "#c4a7e7" }


[tasks]
border  = { fg = "#c4a7e7" }
title   = {}
hovered = { fg = "#c4a7e7", bold = true }


[which]
mask            = { bg = "#16141f" }
cand            = { fg = "#9ccfd8" }
rest            = { fg = "#908caa" }
desc            = { fg = "#c4a7e7" }
separator       = "  "
separator_style = { fg = "#403d52" }


[help]
on      = { fg = "#9ccfd8" }
run     = { fg = "#c4a7e7" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#16141f", bg = "#e0def4" }


[spot]
border   = { fg = "#c4a7e7" }
title    = { fg = "#c4a7e7" }
tbl_col  = { fg = "#9ccfd8" }
tbl_cell = { fg = "#c4a7e7", bg = "#26233a" }


[notify]
title_info  = { fg = "#31748f" }
title_warn  = { fg = "#f6c177" }
title_error = { fg = "#eb6f92" }


[filetype]
rules = [
	{ mime = "image/*", fg = "#9ccfd8" },
	{ mime = "{audio,video}/*", fg = "#f6c177" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c4a7e7" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#31748f" },
	{ mime = "vfs/{absent,stale}", fg = "#908caa" },
	{ url = "*", fg = "#e0def4" },
	{ url = "*/", fg = "#c4a7e7" },
]


