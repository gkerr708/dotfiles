# Modern, minimal, no powerline shapes
add_newline = true
command_timeout = 5000

format = "$username$directory$git_branch$git_status$python$nodejs$rust$docker_context$jobs$line_break$character"
right_format = "$time"

# Use this palette by default
palette = "rose_pine"

# Rosé Pine colors (black background)
[palettes.rose_pine]
rosewater = "#ebbcba"
flamingo  = "#ebbcba"
pink      = "#c4a7e7"
mauve     = "#c4a7e7"
red       = "#eb6f92"
maroon    = "#eb6f92"
peach     = "#f6c177"
yellow    = "#f6c177"
green     = "#31748f"
teal      = "#9ccfd8"
sky       = "#9ccfd8"
sapphire  = "#c4a7e7"
blue      = "#9ccfd8"
lavender  = "#c4a7e7"
text      = "#e0def4"
subtext1  = "#908caa"
subtext0  = "#908caa"
overlay2  = "#908caa"
overlay1  = "#6e6a86"
overlay0  = "#6e6a86"
surface2  = "#403d52"
surface1  = "#26233a"
surface0  = "#16141f"
base      = "#000000"
mantle    = "#000000"
crust     = "#000000"

# ── Core look
[username]
show_always = false
format = "[$user ](fg:teal)"
disabled = false

[directory]
style = "bold fg:text"
format = "[$path]($style) "
truncate_to_repo = false
truncation_symbol = "…/"
truncation_length = 100
read_only = " "

# ── Git (minimal)
[git_branch]
symbol = ""
style = "fg:blue"
format = "[$symbol $branch]($style) "

[git_status]
style = "fg:subtext0"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "C"
ahead = "↑$count"
behind = "↓$count"
diverged = "↕"
stashed = "≡"
modified = "±"
renamed = "»"
deleted = "D"
untracked = "·"

# ── Runtimes (show only when relevant)
[python]
format = "[(($virtualenv)) ](fg:yellow)"
pyenv_version_name = true

[nodejs]
symbol = ""
style = "fg:green"
format = "[$symbol $version]($style) "

[rust]
symbol = ""
style = "fg:red"
format = "[$symbol $version]($style) "

[docker_context]
symbol = ""
style = "fg:teal"
format = "[$symbol $context]($style) "

# ── Useful signals
[cmd_duration]
min_time = 1000
style = "fg:mauve"
format = "[ $duration]($style) "

[jobs]
symbol = ""
style = "fg:peach"
number_threshold = 1
format = "[$symbol $number]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "fg:blue"
format = "[$time]($style)"

# ── Prompt char: subtle success/error
[character]
success_symbol = "[›](fg:green)"
error_symbol   = "[›](fg:red)"
vimcmd_symbol  = "[‹](fg:teal)"
