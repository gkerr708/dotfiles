##### General
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc"
set -g mouse on
set -g history-limit 10000
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi
setw -g synchronize-panes off

##### Status bar (top, transparent, white text)
set -g status-position top
set -g status-style bg=default,fg=white
set -g window-status-style         bg=default,fg=white
set -g window-status-current-style bg=default,fg=brightwhite,bold
set -g window-status-activity-style bg=default,fg=white,bold
set -g window-status-bell-style     bg=default,fg=white,bold
set -g window-status-format ''
set -g window-status-current-format ''
set -g monitor-activity on
set -g monitor-bell on
set -g visual-activity off

##### Prefix (Ctrl-Space)
unbind C-b
set -g prefix M-l 
bind M-l send-prefix

##### Git + Python (left) and prefix indicator+path+clock+session (right)
set -g status-interval 2
set -g status-left-length 400
set -g status-right-length 400
set -g status-left  '#[fg=white,bold]<#S>#[default] #[fg=white]<#I|#W#F>#[default] #(cd "#{pane_current_path}" && bash ~/.config/tmux/git.sh) #(cd "#{pane_current_path}" && bash ~/.config/tmux/python.sh) '
#set -g status-right '#{prefix_highlight} #{pane_current_path} #S'
set -g status-right '#{prefix_highlight} #[fg=white]#{pane_current_path}#[default]'
set -g status-left-style  bg=default,fg=white
set -g status-right-style bg=default,fg=white

##### Allow passthrough 
set -g allow-passthrough on

##### Better CWD behavior (new windows/splits inherit path)
bind c  new-window  -c "#{pane_current_path}"
unbind '"'
bind '"' split-window -v -c "#{pane_current_path}"
unbind %
bind %  split-window -h -c "#{pane_current_path}"

##### Fast navigation / housekeeping
set -g renumber-windows on
bind -n M-Left  previous-window
bind -n M-Right next-window
bind R respawn-pane -k -c "#{pane_current_path}"

##### Session management (tmux-fzf)
bind w choose-tree -Zw
bind s choose-tree -Zs
bind t run-shell -b "TMUX_FZF_CLIENT='#{client_tty}' TMUX_FZF_SWITCH_CURRENT=1 TMUX_FZF_PREVIEW=0 ~/.config/tmux/plugins/tmux-fzf/scripts/window.sh switch"
bind N command-prompt -p "New session name:" "new-session -s %1 -c '#{pane_current_path}'"

##### UI responsiveness / focus
set -s escape-time 0
set -g focus-events on
set -g aggressive-resize on
set -g display-time 800

##### Pane borders
set -g pane-border-style        fg=brightblack
set -g pane-active-border-style fg=cyan

##### Copy-mode / message styling (match transparent theme)
set -g mode-style          fg=black,bg=cyan
set -g message-style       fg=cyan,bg=default
set -g message-command-style fg=yellow,bg=default
set -g clock-mode-colour   cyan

##### Copy mode (Wayland clipboard)
unbind -T copy-mode-vi y
bind   -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Window selection stays on the default prefix+0..9 (a/s/d/f/g removed, they conflicted)

##### Vim-like pane nav/resize
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### Copy mode extras
bind n copy-mode
bind -T copy-mode-vi i send -X cancel
bind -T copy-mode-vi v send -X begin-selection

##### Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

##### Plugins (must be BEFORE TPM run)
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @prefix_highlight_fg 'black'
set -g @prefix_highlight_bg 'white'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'
#set -g @plugin 'tmux-plugins/tmux-resurrect'
#set -g @plugin 'tmux-plugins/tmux-continuum'
#set -g @continuum-restore 'off'


##### TPM (keep at bottom)
run '~/.config/tmux/plugins/tpm/tpm'
