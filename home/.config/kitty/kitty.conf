# kitty.conf
allow_remote_control yes
listen_on unix:/tmp/kitty

# This looks nice
#background_opacity 0.55
#dynamic_background_opacity yes

clipboard_control write-clipboard write-primary read-clipboard read-primary

background_opacity 1.0
dynamic_background_opacity no

enable_audio_bell no

map alt+y change_font_size all -1.0
map alt+u change_font_size all 0
map alt+o change_font_size all +1.0


font_family   JetBrainsMono Nerd Font
font_size     14

#include catppuccin-mocha.conf


# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# Extended palette slot 16 = Mocha Base (#1e1e2e), i.e. the true background.
# `kitten themes` only remaps color0-15 to accent colors, so nothing in the
# normal 16-color set matches the plain terminal background. VisiData's
# color_current_cell needs an explicit, real color number to force the
# cursor cell back to "no highlight" (see ~/.visidatarc) — color16 is that
# number. Placed after the theme include so `kitten themes` regenerating
# current-theme.conf won't clobber it.
color16 #1e1e2e
