# hyprpaper wallpaper config
# No preload/wallpaper lines here on purpose: this hyprpaper version doesn't
# apply them automatically at startup anyway (see autostart.lua), so the only
# real config for which image goes where is M.wallpaper_internal/external in
# variables.lua. Keeping the path in both places would just risk drifting
# out of sync.

splash = false
ipc = on
