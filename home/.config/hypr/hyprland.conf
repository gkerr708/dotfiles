#workspace = 6, monitor:$xps_home_monitor, persistent:true

# Single monitor home — uncomment to use
workspace = 1, monitor:$xps_home_monitor, persistent:true
workspace = 2, monitor:$xps_home_monitor, persistent:true
workspace = 3, monitor:$xps_home_monitor, persistent:true
workspace = 4, monitor:$xps_home_monitor, persistent:true
workspace = 5, monitor:$xps_home_monitor, persistent:true
workspace = 6, monitor:$xps_home_monitor, persistent:true
workspace = 7, monitor:$xps_home_monitor, persistent:true
workspace = 8, monitor:$laptop_monitor,   persistent:true


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,$cursor_size
env = HYPRCURSOR_SIZE,$cursor_size


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in     = $gaps_in
    gaps_out    = $gaps_out
    border_size = $border_size

    col.active_border   = $color_active_1 $color_active_2 45deg
    col.inactive_border = $color_inactive

    resize_on_border = false
    allow_tearing    = false
    layout           = dwindle
}

decoration {
    rounding       = $rounding
    rounding_power = 2

    active_opacity   = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled      = true
        range        = 4
        render_power = 3
        color        = $color_shadow
    }

    blur {
        enabled    = true
        size       = 3
        passes     = 1
        vibrancy   = 0.1696
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global,         1, 10,   default
    animation = border,         1, 5.39, easeOutQuint
    animation = windows,        1, 4.79, easeOutQuint
    animation = windowsIn,      1, 4.1,  easeOutQuint, popin 87%
    animation = windowsOut,     1, 1.49, linear,       popin 87%
    animation = fadeIn,         1, 1.73, almostLinear
    animation = fadeOut,        1, 1.46, almostLinear
    animation = fade,           1, 3.03, quick
    animation = layers,         1, 3.81, easeOutQuint
    animation = layersIn,       1, 4,    easeOutQuint, fade
    animation = layersOut,      1, 1.5,  linear,       fade
    animation = fadeLayersIn,   1, 1.79, almostLinear
    animation = fadeLayersOut,  1, 1.39, almostLinear
    animation = workspaces,     1, 1.94, almostLinear, fade
    animation = workspacesIn,   1, 1.21, almostLinear, fade
    animation = workspacesOut,  1, 1.94, almostLinear, fade
}

dwindle {
    pseudotile     = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo   = true
}


#############
### INPUT ###
#############

input {
    kb_layout  = $kb_layout
    repeat_rate  = $repeat_rate
    repeat_delay = $repeat_delay

    follow_mouse = 1
    sensitivity  = $mouse_sens
    accel_profile = flat

    touchpad {
        natural_scroll = true
    }
}

cursor {
    no_warps = false
}

device {
    name        = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# Basic
bind = $mainMod, Q, killactive,
bind = $mainMod, W, closewindow,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, T, exec, $terminal
bind = $mainMod, X, exec, hyprlock
bind = $mainMod, V, togglefloating,
bind = $mainMod, B, exec, $browser

# Focus
bind = $altMod, h, movefocus, l
bind = $altMod, j, movefocus, d
bind = $altMod, k, movefocus, u
bind = $altMod, l, movefocus, r

# Split
bind = $mainMod, P, togglesplit,

# Swap windows
bind = $mainMod $altMod, h, swapwindow, l
bind = $mainMod $altMod, j, swapwindow, d
bind = $mainMod $altMod, k, swapwindow, u
bind = $mainMod $altMod, l, swapwindow, r

# Resize
bind = $mainMod CTRL, h, resizeactive, -30 0
bind = $mainMod CTRL, j, resizeactive, 0 30
bind = $mainMod CTRL, k, resizeactive, 0 -30
bind = $mainMod CTRL, l, resizeactive, 30 0

# Switch workspace
bind = $mainMod, A, workspace, 1
bind = $mainMod, S, workspace, 2
bind = $mainMod, D, workspace, 3
bind = $mainMod, F, workspace, 4
bind = $mainMod, G, workspace, 5
bind = $mainMod, H, workspace, 6
bind = $mainMod, J, workspace, 7
bind = $mainMod, K, workspace, 8
bind = $mainMod, SEMICOLON, workspace, 10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, A, movetoworkspace, 1
bind = $mainMod SHIFT, S, movetoworkspace, 2
bind = $mainMod SHIFT, D, movetoworkspace, 3
bind = $mainMod SHIFT, F, movetoworkspace, 4
bind = $mainMod SHIFT, G, movetoworkspace, 5
bind = $mainMod SHIFT, H, movetoworkspace, 6
bind = $mainMod SHIFT, J, movetoworkspace, 7
bind = $mainMod SHIFT, K, movetoworkspace, 8
bind = $mainMod SHIFT, SEMICOLON, movetoworkspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse
bindm = $altMod, mouse:272, movewindow
bindm = $altMod, mouse:273, resizewindow

# Volume & brightness
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 2%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 2%-

# Media
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

layerrule {
    name            = layerrule-1
    blur            = on
    ignore_alpha    = 0.2
    match:namespace = waybar
}

windowrule {
    name          = windowrule-1
    suppress_event = maximize
    match:class   = .*
}

windowrule {
    name             = windowrule-2
    no_focus         = on
    match:class      = ^$
    match:title      = ^$
    match:xwayland   = 1
    match:float      = 1
    match:fullscreen = 0
    match:pin        = 0
}
