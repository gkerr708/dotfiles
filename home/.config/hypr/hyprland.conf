###############
### Variables ###
###############

# Monitors
$laptop_monitor   = eDP-1
$work_monitor     = HDMI-A-2   # Thinkpad work
$xps_home_monitor = DP-1       # XPS-13 work
#$xps_home_monitor = DP-3       # XPS-13 home

# Scale
$laptop_scale = 1.25

# Programs
$terminal    = kitty
$fileManager = kitty -e yazi
$menu        = wofi --show drun --style ~/.config/wofi/style.css
$browser     = firefox

# Wallpapers
$wallpaper_laptop = /home/gkerr/images/arch1.jpg
$wallpaper_extern = /home/gkerr/images/arch5.jpg
$wallpaper_transition = any
$wallpaper_duration   = 0.7

# Look and feel
$gaps_in     = 1
$gaps_out    = 1
$border_size = 1
$rounding    = 4

# Colors
$color_active_1   = rgba(33ccffee)
$color_active_2   = rgba(00ff99ee)
$color_inactive   = rgba(595959aa)
$color_shadow     = rgba(1a1a1aee)

# Cursor
$cursor_size = 24

# Input
$kb_layout     = us
$mouse_sens    = 0.0
$repeat_rate   = 40
$repeat_delay  = 250

# Modifiers
$mainMod = SUPER
$altMod  = ALT


###############
### Display ###
###############

exec-once = $terminal
exec-once = nm-applet
exec-once = waybar

# Clipboard fix
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = /usr/lib/xdg-desktop-portal

# Wallpapers — uncomment the block for your current setup
#exec-once = swww-daemon
## Thinkpad
#exec-once = swww img -o $laptop_monitor   $wallpaper_laptop --transition-type $wallpaper_transition --transition-duration $wallpaper_duration
#exec-once = swww img -o $work_monitor     $wallpaper_extern --transition-type $wallpaper_transition --transition-duration $wallpaper_duration
## XPS-13
#exec-once = swww img -o $laptop_monitor   $wallpaper_laptop --transition-type $wallpaper_transition --transition-duration $wallpaper_duration
#exec-once = swww img -o $xps_work_monitor $wallpaper_extern --transition-type $wallpaper_transition --transition-duration $wallpaper_duration
#exec-once = swww img -o $xps_home_monitor $wallpaper_extern --transition-type $wallpaper_transition --transition-duration $wallpaper_duration

# Monitors
monitor = ,              preferred, auto, auto
monitor = $laptop_monitor, preferred, auto, $laptop_scale


